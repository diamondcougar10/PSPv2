<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"></stop>
      <stop offset="50%" stop-color="#1f2937"></stop>
      <stop offset="100%" stop-color="#0b1120"></stop>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0"></stop>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"></stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"></rect>

  <!-- Soft curves -->
  <path d="M-100,520 C200,380 480,420 780,520 C1080,620 1380,600 1500,520 L1500,800 L-100,800 Z" fill="#0f172a" opacity="0.7"></path>
  <path d="M-100,580 C220,460 520,500 840,580 C1100,650 1380,650 1500,600 L1500,800 L-100,800 Z" fill="#020617" opacity="0.7"></path>

  <!-- Horizontal light streaks -->
  <rect x="0" y="190" width="1280" height="2" fill="url(#lineGrad)" opacity="0.5"></rect>
  <rect x="0" y="260" width="1280" height="2" fill="url(#lineGrad)" opacity="0.35"></rect>
  <rect x="0" y="330" width="1280" height="2" fill="url(#lineGrad)" opacity="0.2"></rect>

  <!-- Subtle circles / orbs -->
  <circle cx="1080" cy="160" r="80" fill="#38bdf8" opacity="0.07"></circle>
  <circle cx="200" cy="120" r="60" fill="#22c55e" opacity="0.05"></circle>
  <circle cx="1040" cy="520" r="110" fill="#6366f1" opacity="0.05"></circle>

  <!-- Title hint (you can hide this in production) -->
  <text x="40" y="80" fill="#9ca3af" font-size="28" font-family="sans-serif" opacity="0.5">
    PSPV2 Shell
  </text>
</svg>
